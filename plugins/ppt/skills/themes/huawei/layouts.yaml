canvas:
  width_px: 1920
  height_px: 1080
  padding_top_px: 88
  padding_left_px: 96
  padding_right_px: 96
  padding_bottom_px: 76

# ===== P0 八版式（§O6 权威字号表）=====

cover_left_bar:
  # 2026-05-31 taste 选型 A (去红条): 全局规则——huawei 风格不要贯穿边缘的细红条; 标题克制
  title_size_px: 88             # ~52pt (旧 108px 巨标题)
  subtitle_size_px: 36
  eyebrow_size_px: 26
  meta_label_size_px: 20
  meta_size_px: 26              # meta value 字号

toc:
  # 2026-05-31 taste 选型 C (去页码): 克制标题 + 红编号列表, 无巨号/无页码/无分隔线
  header_size_px: 66            # ~40pt 标题 (旧 giant_title 300px 违反 P3)
  header_suffix: "· CONTENTS"   # 标题后缀 (设 "" 可去掉双语后缀)
  number_size_px: 57            # ~34pt 红编号 (强调但不巨大)
  item_size_px: 33              # ~20pt 章节标题

section_divider_dark:
  # 2026-05-31 taste 选型 B: 浅底极简章节过渡页 (旧深底 ink_dark + 360px 巨号违反 P1/P3, 用户评 0)
  title_size_px: 66             # ~40pt, 合 P3 (标题 ≤ 正文 3 倍)
  tag_size_px: 27               # ~16pt 章节标签 (eyebrow · number)
  description_size_px: 27       # ~16pt 描述
  background_token: paper       # 浅底 (旧 ink_dark 深炭黑)
  tag_color_token: primary      # 红色标签
  title_color_token: ink        # 黑色标题
  desc_color_token: ink_soft    # 次级灰描述

kpi_stats:
  columns: 4
  value_size_px: 108            # 修正：HTML 实测 108（原 96）
  unit_size_px: 32
  label_size_px: 18             # 修正：HTML 实测 18（原 20）
  desc_size_px: 16
  trend_size_px: 14             # 修正：HTML 实测 14（原 16）
  column_separator_width_px: 2

matrix_2x2:
  axis_y_column_px: 140
  axis_x_row_px: 140
  grid_gap_px: 20
  border_width_px: 2
  border_token: ink
  quadrant_heading_size_px: 22
  y_axis_label_size_px: 20
  small_label_size_px: 14
  desc_size_px: 16

architecture_layered:
  header_column_px: 260
  cell_columns: 6
  layer_gap_px: 14
  header_background_token: paper_3
  header_name_size_px: 24
  header_label_size_px: 14
  cell_title_size_px: 16
  cell_desc_size_px: 14

timeline_huawei:
  phase_column_px: 180
  year_size_px: 48              # 大纪元数字
  title_size_px: 22
  desc_size_px: 16

process_flow_huawei:
  step_min_width_px: 240
  arrow_gap_px: 40
  step_title_size_px: 24
  step_desc_size_px: 16
  step_number_size_px: 14

# ===== P1 五版式 =====

swot:
  cross_line_width_px: 2
  cross_line_token: primary
  letter_size_px: 42          # 象限角标字母 (S/W/O/T) 字号; 42px≈25.2pt (旧硬编码 h4*1.5)

roadmap:
  lane_column_px: 180
  phase_bar_height_px: 56

pyramid:
  levels_default: 4
  top_width_ratio: 0.35
  # 2026-05-31 taste 选型 A 红色渐变阶梯: 顶浓红(primary) → 底极浅红 线性插值,
  # 替代旧 顶 primary_dark + 二 primary + 下 paper_2 的"红红灰灰灰"断裂配色 (顶层近黑被用户评低)
  gradient_top_token: primary
  gradient_bottom_hex: "#FBE9EA"

heatmap_matrix:
  row_label_column_px: 220
  total_column_px: 220
  score_chars: "█████"          # 研究报告推荐 Unicode 方案 A

thankyou:
  # 2026-05-31 taste 选型 A: 浅底华为致谢式 (旧红底 360px 巨字违反 P1/AP2/AP3, 用户评 2/1)
  # 2026-06-12 issue: 160px(~96pt) 仍占画面 1/3+ 命中 AP3, 收敛到 88px(~52.8pt) 对照 golden banking-p043
  title_size_px: 88             # ~52.8pt
  eyebrow_size_px: 27           # ~16pt 红色小标签
  emphasis_size_px: 54          # ~32pt 红色 punchline (第二行强调)
  subtitle_size_px: 30          # ~18pt
  label_size_px: 20             # ~12pt 联系方式标签
  value_size_px: 26             # ~15.6pt 联系方式值
  background_token: paper       # 白底 (旧 primary 红满底)
  title_color_token: ink        # 黑色大字
  left_column_in: 6.5
  right_column_x_in: 8.0
  contact_columns: 4

# ===== P2 四版式 =====

cards_6:
  columns: 3
  rows: 2

rings:
  ring_count_max: 3
  right_list_gap_px: 28

personas:
  columns_max: 4
  quote_accent_bar_px: 3

# ===== top_tabs 通用 =====

top_tabs:
  tab_count: 4
  gap_px: 12

# ===== risk-list / governance 专属 =====

risk_list:
  columns_max: 2
  severity_bar_width_px: 4

governance:
  top_box_height_px: 120
  unit_columns_max: 4
