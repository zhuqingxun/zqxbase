      description: "五位一体——缺一项都会让上层机制退化"
      levels:
        - {title: "治理独立", desc: "人事决策机构直通 一把手，不隶属业务单位；必须由董事会在公司章程层面固化"}
        - {title: "制度硬约束", desc: "把轮岗写进晋升硬门槛，不靠鼓励靠规则——broadening 必填 + Senior Rater Profile"}
        - {title: "算法匹配", desc: "用数学消除博弈，诚实表达偏好是最优策略（Gale-Shapley 1962 诺奖算法）"}
        - {title: "数据底座", desc: "没有统一人才数据库，集中化就是人情办事——KSB-P 结构化标签是必要起点"}
        - {title: "10 年耐心", desc: "改革必须跨任期传承，不依赖个人意志；Talent Committee 章程化固化考核目标"}
