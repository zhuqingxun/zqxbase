  - id: 17
    role: content
    chapter: "落地风险"
    visual_type: "risk-list"
    content:
      title: "落地风险：5 个高概率陷阱"
      description: "基于美军 DOPMA/COHORT 教训 + IBM 强制度差异——每个风险含历史案例与缓解策略"
      risks:
        - {number: "01", title: "数据底座缺位强推集中化", desc: "美军 HRC 先有 IPPS-A 20 年建设再做集中化；企业若无统一人才数据库就搞 Talent Board 会退化为人情办事", mitigation: "先用 2-3 年做 KSB-P 结构化 + 内部市场 MVP，验证数据可信后再授权集中决策", severity: "HIGH"}
        - {number: "02", title: "制度无文化支撑变形式", desc: "2014 OER 改革 10 年后 muddy boot 文化惯性仍在——制度约束如果没有 Wardynski 式文化建构会被从业者绕过", mitigation: "文化建设与制度改革同步启动，一把手 亲自讲述 broadening 故事，高管故事会常态化", severity: "HIGH"}
        - {number: "03", title: "去中心化 COHORT 复刻", desc: "1980s 美军 Project COHORT 把人事决策权下放到师级，晋升率停滞 40%。企业常犯的错：让 BU 自己管干部流动", mitigation: "绝不把人事决策权下放业务单位，坚守 人力负责人 直通 一把手 的治理架构", severity: "MED"}
        - {number: "04", title: "家庭配套缺位致抗拒", desc: "美军 DoDEA + 搬家补贴 + 配偶就业三件套托底；企业若无配套福利则轮岗被视为惩罚，反向淘汰精英", mitigation: "配套福利预算与调动需求同步规划，搬家补贴 ≥ 3 个月工资 + 子女教育衔接基金", severity: "MED"}
    variant:
