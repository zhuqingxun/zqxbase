# Fixture manifest: us-military-rotation
# 记录本 fixture 的 schema 版本 / 录制元数据 / 脱敏映射 / 重录 SOP.

schema_version: "1.0"          # 与 orchestrator manifest schema 同源; S4 改 schema 时一并 bump
plugin_version: "3.5.0"        # 录制时 ppt plugin 版本

recorded_at: "2026-06-11"
source_project: "us-military-rotation (insight 研究项目, 已脱敏)"
topic: "美军军官轮岗制度 -> 企业干部流动机制的组织设计研究"

# fixture 内容清单
contents:
  input: "10 个脱敏后 markdown (deck 实际引用的源材料)"
  recorded:
    architect-output.yaml: "= content-architecture (Stage 2 LLM 产出, 脱敏后)"
    plan-output.yaml: "= slide-plan (Stage 3 LLM 产出, 脱敏后, 19 slides)"
  expected: "assertions.yaml (E2E 机器断言基准)"
  baseline: "baseline.md (人工质量基准)"
# 注: 不入库 parsed-content.json (派生物, replay 从 input/ 重跑 parse 生成;
#     且 .json 不在脱敏扫描扩展名内, 避免覆盖缺口. 见 plan D6/D7).

# 脱敏映射 (K01-K22 零容忍: 全部改源措辞, 未加白名单/未改敏感词表)
# 注: 本段只描述脱敏后的目标词与类别, 不复写命中原文 (否则映射文档自身被扫到命中).
desensitization:
  K16_职位代称_替换为中文通用词:
    - "英文高管职位缩写 -> 一把手 (最高决策者)"
    - "英文 HR 负责人缩写 -> 人力负责人"
    - "英文信息/技术负责人缩写 -> 信息负责人 / 技术负责人 (本 fixture 无命中, 规则预置)"
  K17_误报_改近义词避开正则:
    # 8 处中文词被 K17 正则 ([一-龥]{1,3} + 称谓字) 误命中, 均非真实人名,
    # 已逐处改近义词. 详见 git diff (避免本文件复写命中原文).
    count: 8
    target_words: ["汇编", "整体", "归纳", "主管", "统称"]
  本机路径清理:
    - "meta.source_files 的本机绝对路径 -> 相对占位 input/<filename>"

# 脱敏验证
desensitization_scan: "tests/pixel/assert_no_sensitive.py 扫 fixture 根 -> 0 命中 (PASS)"

# 重录 SOP (素材或 schema 变化时)
re_record_sop: |
  1. 从原始未脱敏素材 (insight 项目 research/) 重新跑 orchestrator run -> 会话产 architect/plan output
  2. 把 output.yaml 摆成 recorded/{architect,plan}-output.yaml
  3. 跑脱敏脚本 (K16/K17 改源 + 路径清理), scan 必须 0 命中才入库
  4. 更新本 manifest 的 recorded_at / plugin_version / 新增脱敏映射
  5. replay 跑通 (exit 0 + slide 数对) + 更新 expected/assertions.yaml
