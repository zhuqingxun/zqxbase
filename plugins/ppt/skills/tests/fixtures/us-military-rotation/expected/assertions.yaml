# E2E 断言基准 (us-military-rotation fixture)
# 由 tester 的域 C 断言 (tests/integration/test_e2e_us_military.py) 消费.
# 值从脱敏后 recorded/plan-output.yaml 实测推导 (2026-06-11), 真实反映 replay 产物.

# replay 渲染出的 slide 总数 (= narrative.total_slides = len(slides))
expected_slide_count: 19

# 每页 visual_type 顺序 (与 recorded/plan-output.yaml slides[].visual_type 严格一致)
expected_visual_type_sequence:
  - cover-left-bar
  - toc
  - kpi-stats
  - section-divider-dark
  - governance
  - pyramid
  - kpi-stats
  - process-flow-huawei
  - architecture-layered
  - matrix-2x2
  - timeline-huawei
  - cards-6
  - heatmap-matrix
  - section-divider-dark
  - pyramid
  - roadmap
  - risk-list
  - thankyou
  - section-divider-dark

# huawei 18 版式应用率下限 (实测 1.0, 留余量到 0.95)
min_application_rate: 0.95

# 渲染产物中不得出现的占位/残留子串 (脱敏 + 模板未解析检测)
forbidden_substrings:
  - "[待填]"
  - "TODO"
  - "code='"
  - "{{"
  - "}}"
