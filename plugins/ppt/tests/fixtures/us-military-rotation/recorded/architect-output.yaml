  - title: "三层痛点与本质定位"
    key_message: "干部调不动不是 HR 能解决的问题，是公司治理层面的架构设计缺陷"
    source_refs:
      - "brainstorm-summary-us-military-rotation.md:18-24"
      - "delivery-report-us-military-rotation.md:47-52"
    slide_briefs:
      - slide_id: 3
        slide_title: "调不动的三层真实约束"
        visual_type_hint: "kpi-stats"
        description: "企业高管面对的'干部调不动'困局在三个层面同时发生，任何单点优化都无法破解"
        raw_content:
          subtitle: "意愿层 / 博弈层 / 效率层——三层同时作用才形成锁死"
          kpis_data:
            - label: "意愿层"
              value: "不匹配"
              desc: "干部个体意愿与组织需求错位，个人发展诉求被模糊处理"
            - label: "博弈层"
              value: "被绑架"
              desc: "干部所在部门的留人意愿压过公司整体调配需要，部门保护主义系统性存在"
            - label: "效率层"
              value: "成本高"
              desc: "单个体调动沟通成本高、审批链条长，大批量调整几乎不可能"
        footnote: "数据来源：企业高管访谈摘要（brainstorm-summary-us-military-rotation.md）"

      - slide_id: 4
        slide_title: "本质：这不是 HR 问题，是公司治理问题"
        visual_type_hint: "section-divider-dark"
        description: "人事决策机构必须在治理结构上独立于业务单位——这是组织架构层面的设计，HR 部门无权推动"
        raw_content:
          big_number: "01"
          eyebrow: "第一个认知转换"
          title: "这不是 HR 问题，是公司治理问题"
          description_text: "美军 HRC 是 Direct Reporting Unit，直通参谋部不隶属任何作战司令部；IBM 人力负责人 直通 一把手。共同点：人事决策机构必须在治理结构上独立于业务单位——只有公司章程能推动，HR 部门无权设计"

