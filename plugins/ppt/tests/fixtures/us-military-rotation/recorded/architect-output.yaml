      - slide_id: 14
        slide_title: "关键差异：强制度 vs 自愿市场"
        visual_type_hint: "section-divider-dark"
        description: "IBM 的 Blue Opportunities 是'自愿市场'，员工可不申请；美军是'制度硬约束'，不 broadening 就不晋升——企业借鉴时必须自问愿意走到哪一步"
        raw_content:
          big_number: "02"
          eyebrow: "第二个认知转换"
          title: "愿不愿意走到'强制'这一步"
          description_text: "IBM Blue Opportunities 是自愿市场；美军是制度硬约束——不轮岗就不晋升。企业借鉴时的核心抉择：是满足于'鼓励内部流动'的半强制，还是走到'非轮岗不晋升'的全强制？后者对治理成熟度要求极高"

  - title: "五大洞察与落地路径"
    key_message: "五条可迁移到企业的治理原则 + 3 阶段 10 年路径图"
    source_refs:
      - "delivery-report-us-military-rotation.md:47-62"
      - "notes-07-ibm-lead.md:115-131"
    slide_briefs:
      - slide_id: 15
        slide_title: "给 一把手 的五条治理原则"
        visual_type_hint: "pyramid"
        description: "从治理顶层到文化底座，五条原则必须同时落地才能避免'调不动'退化成'形式轮岗'——从底往上读是落地顺序，从上往下读是决策依据"
        raw_content:
          subtitle: "五位一体：缺一项都会让上层机制退化"
          levels_data:
            - {name: "治理独立", tag: "人事决策机构直通 一把手，不隶属业务单位"}
            - {name: "制度硬约束", tag: "把轮岗写进晋升硬门槛，不靠鼓励靠规则"}
            - {name: "算法匹配", tag: "用数学消除博弈，诚实表达偏好最优"}
            - {name: "数据底座", tag: "没有统一人才数据库，集中化就是人情办事"}
            - {name: "10 年耐心", tag: "改革必须跨任期传承，不依赖个人意志"}
          descriptions_data:
            - number: "01"
              heading: "治理不是 HR 能推动的"
              body: "必须在公司章程层面固化，由董事会主推。美军 HRC 作为 DRU 直通参谋部、IBM 人力负责人 直通 一把手——共同特征是人事决策在治理架构上独立于业务单位，这是 HR 部门无权推动的组织设计"
            - number: "02"
              heading: "硬约束与软引导缺一不可"
              body: "美军 2014 OER 改革把 broadening 推荐从'可选'改'必填'是硬约束；Wardynski 六卷本 + Junior Officer Center 把 broadening 从'职业风险'重塑为'pentathlete 精英标志'是软引导。任一单点都会失败：只有制度无文化则制度变形式，只有文化无制度则文化变口号"

      - slide_id: 16
        slide_title: "企业落地：3 阶段 10 年路径图"
        visual_type_hint: "roadmap"
        description: "按'数据 → 制度 → 文化'三阶段推进，每阶段约 3 年——避免在数据底座缺位时就做强制轮岗，导致集中化退化为人情办事"
        raw_content:
          subtitle: "10 年尺度 · 3 阶段 · 跨任期传承"
          phases_list:
            - {code: "P1", title: "打底座", summary: "0-3 年：数据与治理"}
            - {code: "P2", title: "立制度", summary: "3-6 年：硬约束与算法"}
            - {code: "P3", title: "塑文化", summary: "6-10 年：Pentathlete 文化"}
          rows_data:
            - label: "治理"
              cells:
                - {title: "人力负责人 直通 一把手", desc: "修改公司章程，人事决策独立于 BU", emphasis: "bar"}
                - {title: "Talent Board 设立", desc: "董事会下设独立委员会", emphasis: null}
                - {title: "章程化固化", desc: "跨任期传承机制写入制度", emphasis: null}
            - label: "数据"
              cells:
                - {title: "KSB-P 统一标签", desc: "企业版人才画像结构化落地", emphasis: "bar"}
                - {title: "内部市场 MVP", desc: "对标 Blue Opportunities 的平台", emphasis: null}
                - {title: "AI 匹配算法", desc: "Gale-Shapley 类稳定匹配", emphasis: null}
            - label: "制度"
              cells:
                - {title: "定义 broadening 岗", desc: "识别关键轮岗位 + 周期", emphasis: null}
                - {title: "晋升硬门槛", desc: "无轮岗不进入晋升池", emphasis: "bar"}
                - {title: "Rater 双层分离", desc: "评分与推荐职责切割", emphasis: null}
            - label: "文化"
              cells:
                - {title: "高管故事会", desc: "一把手 亲身示范轮岗", emphasis: null}
                - {title: "Pentathlete 叙事", desc: "发布人才战略白皮书", emphasis: null}
                - {title: "同辈传承", desc: "Junior Officer Center 企业版", emphasis: "bar"}
          milestones_data:
            - {code: "M1", title: "3 年", desc: "数据底座就绪，内部市场 MVP 上线"}
            - {code: "M2", title: "6 年", desc: "制度硬约束生效，首轮轮岗成为晋升必要条件"}
            - {code: "M3", title: "10 年", desc: "Pentathlete 文化成型，制度 + 文化 + 算法三重闭环"}

      - slide_id: 17
        slide_title: "落地风险：5 个高概率陷阱"
        visual_type_hint: "risk-list"
        description: "基于美军 DOPMA/COHORT 历史教训 + IBM 强制度差异分析，识别企业改革最易踩的 5 个坑——每个风险均有美军历史案例佐证"
        raw_content:
          subtitle: "按严重度排序 · 每项含缓解策略"
          risks_data:
            - number: "01"
              title: "数据底座缺位时强推集中化"
              desc: "美军 HRC 先有 IPPS-A 20 年建设再做集中化；企业若无统一人才数据库就搞 Talent Board 会退化为人情办事"
              mitigation: "先用 2-3 年做 KSB-P 结构化 + 内部市场 MVP，验证数据可信后再授权集中决策"
              severity: "HIGH"
              probability: "高"
              impact: "集中化名义化，实际决策仍分散"
            - number: "02"
              title: "制度无文化支撑变形式"
              desc: "2014 OER 改革 10 年后 muddy boot 文化惯性仍在——制度约束如果没有 Wardynski 式文化建构，会被从业者绕过"
              mitigation: "文化建设与制度改革同步启动，一把手 亲自讲述 broadening 故事，高管故事会常态化"
              severity: "HIGH"
              probability: "高"
              impact: "制度合规但实际调不动"
            - number: "03"
              title: "去中心化 COHORT 复刻"
              desc: "1980s 美军 Project COHORT 把人事决策权下放到师级单位，晋升率停滞 40%。企业常犯的错：让 BU 自己管干部流动"
              mitigation: "绝不把人事决策权下放业务单位，坚守 人力负责人 直通 一把手 的治理架构"
              severity: "MED"
              probability: "中"
              impact: "部门保护主义系统性固化"
            - number: "04"
              title: "家庭配套缺位致抗拒"
              desc: "美军 DoDEA 子女教育 + 搬家补贴 + 配偶就业三件套托底；企业若无配套福利则轮岗被视为惩罚"
              mitigation: "配套福利预算与调动需求同步规划，搬家补贴 ≥ 3 个月工资 + 子女教育衔接基金"
              severity: "MED"
              probability: "中"
              impact: "高潜拒绝轮岗，改革反向淘汰精英"
            - number: "05"
              title: "跨任期断档"
              desc: "10 年尺度的改革依赖 2-3 任 一把手 持续投入；单任期 一把手 如果中途放弃会导致系统回退"
              mitigation: "改革主责由董事会 Talent Committee 持有，章程化固化考核目标不依赖个人意志"
              severity: "MED"
              probability: "中"
              impact: "10 年周期断档，回到起点"
        footnote: "风险框架来源：COHORT 失败 + DA Form 4991 社会性死亡 + AIM 2.0 location 偏见（gemini-deep-research + notes-06-culture）"

