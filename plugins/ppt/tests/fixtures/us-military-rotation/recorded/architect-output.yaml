  - title: "IBM 对照：企业如何做同构设计"
    key_message: "IBM 用多项目组合（HRLDP/GMLDP/FLDP/GFLDP/Extreme Blue + Blue Opportunities）复刻了美军的核心逻辑——集中化治理 + 内部市场 + 数据驱动"
    source_refs:
      - "notes-07-ibm-lead.md:13-130"
    slide_briefs:
      - slide_id: 12
        slide_title: "IBM LEAD 体系：六大项目组合"
        visual_type_hint: "cards-6"
        description: "IBM 把'美军军官调动'对应到 5 个领导力发展项目 + 1 个全员内部市场，覆盖从高潜筛选到 345,000 员工的跨级流动"
        raw_content:
          subtitle: "5 个 LDP + 1 个内部市场 = 等效于美军 HRC 的企业版闭环"
          cards_data:
            - heading: "HRLDP"
              body: "HR Leadership Development Program — 3 年 3 段轮岗，每段 1 年跨 HR 功能（人才/薪酬/组织发展）"
            - heading: "GMLDP"
              body: "General Management LDP — 3 年跨业务线轮岗，对标美军 broadening 跨兵种经历"
            - heading: "Finance LDP"
              body: "财务领导力项目，跨财务功能（会计/战略/FP&A）3 年轮岗培养未来 CFO"
            - heading: "GFLDP"
              body: "Global Financing LDP — 全球金融业务线轮岗，覆盖北美/欧洲/亚太"
            - heading: "Extreme Blue"
              body: "高潜早期选拔：技术/商科双背景学生快速通道，对标美军西点军校"
            - heading: "Blue Opportunities"
              body: "全员内部市场：345,000 员工，50%+ 空缺通过内部填补，对标 AIM 2.0 marketplace"
        footnote: "数据来源：IBM 2025 Annual Report + Josh Bersin 分析（notes-07-ibm-lead.md）"

